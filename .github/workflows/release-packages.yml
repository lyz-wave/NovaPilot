name: release-packages

# 推送 v* 标签时,在 Windows/macOS/Linux 三平台云端构建"免安装体验包"
# (内置 Node 运行时 + 依赖 + 构建产物),自动创建 GitHub Release 并挂载。
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
            node_archive: https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz
          - os: macos-latest
            label: macos-arm64
            node_archive: https://nodejs.org/dist/v22.14.0/node-v22.14.0-darwin-arm64.tar.gz
          - os: windows-latest
            label: windows-x64
            node_archive: https://nodejs.org/dist/v22.14.0/node-v22.14.0-win-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm ci
      # B2:语义模型是 24MB 二进制,不进仓库(见 .gitignore),打包时现拉。
      # 拉不下来就直接失败 —— 免安装包必须自带模型,否则用户断网时只能降级到
      # 哈希向量,「离线可用真实语义检索」这条卖点就不成立了。
      - name: Fetch embedding model
        run: npm run model:fetch
      - name: Verify degradation + semantic tests
        run: npx vitest run src/server/rag/semantic.test.ts src/server/rag/wordpiece.test.ts
      - name: Build
        run: npm run build
      - name: Prepare portable Node runtime
        shell: bash
        run: |
          mkdir -p pkg/runtime
          curl -sL -o /tmp/node-dist "${{ matrix.node_archive }}"
          case "${{ matrix.node_archive }}" in
            *.tar.xz) tar -xJf /tmp/node-dist -C pkg/runtime --strip-components=1 ;;
            *.tar.gz) tar -xzf /tmp/node-dist -C pkg/runtime --strip-components=1 ;;
            *.zip)
              unzip -q /tmp/node-dist -d /tmp/nodedir
              mv /tmp/nodedir/*/* pkg/runtime/
              ;;
          esac
          echo "runtime ready"
          ls pkg/runtime | head -5
      - name: Assemble bundle
        shell: bash
        run: |
          mkdir -p pkg/app
          cp -R .next pkg/app/
          cp -R node_modules pkg/app/
          cp -R src pkg/app/
          cp -R scripts pkg/app/ 2>/dev/null || true
          # B3:知识文档目录必须进包。ensureSeeded() 首次种库时会摄取它,评委打开
          # 就是 15 篇知识;缺了它只剩 7 篇内置种子,召回覆盖面直接缩水一半。
          cp -R data pkg/app/
          test "$(ls pkg/app/data/knowledge/*.md | wc -l)" -ge 8 \
            || { echo "知识文档没进包"; exit 1; }
          # B2:模型目录必须进包。缺了它应用还能起(降级到哈希向量),但那不是
          # 我们要交付的形态,所以这里硬校验。
          cp -R models pkg/app/
          test -f "pkg/app/models/bge-small-zh-v1.5/onnx/model_quantized.onnx" \
            || { echo "模型没进包"; exit 1; }
          cp package.json package-lock.json next.config.ts tsconfig.json vitest.config.ts next-env.d.ts pkg/app/ 2>/dev/null || true
          cp -R docs pkg/app/ 2>/dev/null || true
          cp -R screenshots pkg/app/ 2>/dev/null || true
          cp README.md README.zh-CN.md pkg/app/ 2>/dev/null || true
          cp docs/参赛方案提交文档.md docs/前端优化说明.md docs/架构说明.md docs/部署说明.md docs/demo视频脚本.md docs/评委快速上手.md pkg/app/ 2>/dev/null || true
          cp -R pkg/runtime pkg/app/runtime
          rm -rf pkg/runtime
          ls pkg/app | head -20
      - name: Launcher scripts
        shell: bash
        run: |
          cat > pkg/app/start.sh <<'EOF'
          #!/bin/sh
          cd "$(dirname "$0")"
          PORT=3210 ./runtime/bin/node node_modules/next/dist/bin/next start
          EOF
          cp pkg/app/start.sh pkg/app/启动.command
          chmod +x pkg/app/start.sh pkg/app/启动.command
          cat > pkg/app/启动.bat <<'EOF'
          @echo off
          chcp 65001 >nul
          cd /d %~dp0
          echo NovaPilot 启动中... 浏览器打开 http://localhost:3210
          set PORT=3210
          runtime\node.exe node_modules\next\dist\bin\next start
          pause
          EOF
      # ── §9 免安装包冷启动计时 ──
      # 指标体系 v1.1 第 9 节「免安装包冷启动时间」:从解压完成到服务首次响应的耗时。
      # 这里不解压整包(CI 里已展开),而是从「便携 Node 启动 next start」到「/ 返回 200」
      # 的实际等待时间——这就是评委双击 启动.bat 后需要等多久。
      # 超过 30 秒不失败,但会打印警告(硬性限制由 README「首次加载约 1-2 秒」口径决定)。
      - name: Cold-start timing (packaged runtime)
        shell: bash
        working-directory: pkg/app
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NODE_BIN="./runtime/node.exe"
          else
            NODE_BIN="./runtime/bin/node"
          fi
          # 启动服务
          PORT=3210 "$NODE_BIN" node_modules/next/dist/bin/next start &
          SERVER_PID=$!
          START_MS=$(date +%s%3N 2>/dev/null || python3 -c "import time; print(int(time.time()*1000))")
          # 等待 / 返回 200(最多 60 秒,每 500ms 重试一次)
          READY=0
          for i in $(seq 1 120); do
            sleep 0.5
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3210/ --max-time 2 2>/dev/null || true)
            if [ "$CODE" = "200" ] || [ "$CODE" = "308" ]; then
              READY=1
              break
            fi
          done
          END_MS=$(date +%s%3N 2>/dev/null || python3 -c "import time; print(int(time.time()*1000))")
          ELAPSED=$(( END_MS - START_MS ))
          kill $SERVER_PID 2>/dev/null || true
          if [ "$READY" = "1" ]; then
            echo "冷启动完成:${ELAPSED} ms (${ELAPSED}ms from next-start to HTTP 200)"
            if [ "$ELAPSED" -gt 30000 ]; then
              echo "::warning ::冷启动 ${ELAPSED}ms > 30s 建议排查"
            fi
          else
            echo "::error ::冷启动 60 秒内未收到 HTTP 200,服务启动失败"
            exit 1
          fi
      # ── B2 双保险 ──
      # 上面的 vitest 用的是 CI 自带的 Node;这里换成**打进包里的那个便携 Node**,
      # 读**打进包里的**模型字节和 .wasm,真跑一次推理。三平台各跑一次,任一平台
      # 的 WASM 后端有问题都会在发版前暴露,而不是等评委在自己机器上打开。
      - name: Semantic smoke test (packaged runtime)
        shell: bash
        working-directory: pkg/app
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            NODE_BIN="./runtime/node.exe"
          else
            NODE_BIN="./runtime/bin/node"
          fi
          "$NODE_BIN" --version
          "$NODE_BIN" scripts/smoke-semantic.mjs --text 测试
      - name: Archive package
        shell: bash
        run: |
          cd pkg/app
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            powershell -Command "Compress-Archive -Path '*' -DestinationPath '../NovaPilot-portable-windows-x64.zip' -Force"
          else
            zip -r -q "../NovaPilot-portable-${{ matrix.label }}.zip" .
          fi
          cd ..
          # 记录体积增量口径:模型约 23 MB,压缩后基本不缩(ONNX 已是量化二进制)。
          # 发版时对着上一版对比这两个数,增量明显偏离就说明打包内容出了变化。
          echo "── 体积 ──"
          du -sm app/models || true
          ls -la *.zip
      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            pkg/NovaPilot-portable-*.zip
          generate_release_notes: true
